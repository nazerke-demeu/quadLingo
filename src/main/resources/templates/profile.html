<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuadLingo - The world's best way to learn kazakh</title>
  <link rel="icon" href="https://icon2.cleanpng.com/20180323/are/avd1xo67l.webp">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }


    body {
      font-family: "Poppins", sans-serif;
      background-color: #F8F9FA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .navbar {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #0B1957;
      z-index: 99;
    }

    .nav__content {
      max-width: 1200px;
      margin: auto;
      padding: 1.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      color: #F8F3EA;
      transition: 0.3s;
    }

    .nav__links {
      display: flex;
      align-items: center;
      gap: 1rem;
      list-style: none;
    }

    .nav__links a {
      padding: 0.5rem 1rem;
      border: 2px solid transparent;
      text-decoration: none;
      font-weight: 600;
      color: #F8F3EA;
      transition: 0.3s;
    }

    .nav__links a:hover {
      border-top-color: #F8F3EA;
      border-bottom-color: #F8F3EA;
      color: #F8F3EA;
    }

    .container {
      max-width: 600px;
      margin: 90px auto 20px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      flex: 0 1 auto;
    }

    h2 {
      text-align: center;
      color: #0B1957;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    h3 {
      color: #0B1957;
      margin-top: 25px;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .profile-info p {
      color: #0B1957;
      font-size: 16px;
      margin-bottom: 10px;
    }

  </style>
</head>
<body>

<div class="navbar">
  <div class="nav__content">
    <span class="logo">QuadLingo</span>
    <ul class="nav__links">
      <li>
        <form th:action="@{/logout}" method="post" style="display: inline;">
          <a href="#" onclick="this.parentNode.submit(); return false;">Log Out</a>
        </form>
      </li>
    </ul>
  </div>
</div>

<div class="container">
  <h2>Your Profile</h2>
  <div class="profile-info">
    <p>Name: <span th:text="${name}"></span></p>
    <p>Email: <span th:text="${email}"></span></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>

</body>
</html>
