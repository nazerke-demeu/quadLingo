<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - QuadLingo</title>
  <link rel="icon" href="https://icon2.cleanpng.com/20180323/are/avd1xo67l.webp">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"> <!-- FontAwesome Icons -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    .leaderboard-title {
      text-align: center;
      font-size: 30px;
      font-weight: 600;
      color: #0B1957;
      margin-bottom: 20px;
    }

    .leaderboard-title i {
      margin-left: 10px;
      color: gold;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: #f5f5f5;
    }

    .sidebar {
      width: 250px;
      background: #fff;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      position: fixed;
      height: 100%;
      overflow-y: auto;
    }

    .sidebar .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      justify-content: center;
      padding-top: 20px;
    }

    .sidebar .header h2 {
      font-size: 30px;
      color: #0B1957;
    }

    .sidebar .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
      color: #333;
    }

    .sidebar .menu-item i {
      font-size: 20px;
      color: #666;
    }

    .sidebar .menu-item span {
      font-size: 16px;
    }

    .sidebar .menu-item:hover,
    .sidebar .menu-item.active {
      background: #0B1957;
      color: #fff;
    }

    .sidebar .menu-item:hover i,
    .sidebar .menu-item.active i {
      color: #fff;
    }

    .content {
      margin-left: 250px;
      padding: 30px;
      flex: 1;
    }

    .star {
      color: #ffdf00;
      font-size: 20px;
    }

    .leaderboard-table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      text-align: center;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    .leaderboard-table td i {
      font-size: 24px;
    }

    .gold {
      color: #ffd700;
    }

    .silver {
      color: #c0c0c0;
    }

    .bronze {
      color: #cd7f32;
    }


    .leaderboard-table td:nth-child(3) {
      font-weight: bold;
      color: #0B1957;
    }


    .leaderboard-table th {
      background-color: #0B1957;
      color: white;
    }

    .leaderboard-table td {
      background-color: #f5f5f5;
    }

    .leaderboard-table tr:nth-child(even) td {
      background-color: #e0e0e0;
    }

    .leaderboard-table tr:nth-child(odd) td {
      background-color: #ffffff;
    }

    .leaderboard-table td {
      font-size: 16px;
    }


  </style>
</head>
<body>
<div class="sidebar">
  <div class="header">
    <h2>QuadLingo</h2>
  </div>
  <a th:href="@{/user/profile}" class="menu-item">
    <i class='bx bxs-user'></i>
    <span>Profile</span>
  </a>
  <a th:href="@{/learn}" class="menu-item">
    <i class='bx bxs-book'></i>
    <span>Learn</span>
  </a>
  <a th:href="@{/game}" class="menu-item">
    <i class='bx bxs-game'></i>
    <span>Mini Games</span>
  </a>
  <a th:href="@{/leaderboard}" class="menu-item active">
    <i class='bx bxs-trophy'></i>
    <span>Leaderboard</span>
  </a>
  <div class="menu-item">
    <form th:action="@{/logout}" method="post">
      <button type="submit" style="background: none; border: none; display: flex; align-items: center; gap: 15px; padding: 10px; cursor: pointer; color: #333;">
        <i class='bx bxs-log-out'></i>
        <span>Log Out</span>
      </button>
    </form>
  </div>
</div>
<div class="content">
  <div class="leaderboard-title">
    <span>Leaderboard</span>
    <i class="fas fa-trophy"></i>
  </div>
  <table class="leaderboard-table">
    <thead>
    <tr>
      <th>Место</th>
      <th>Пользователь</th>
      <th>Очки</th>
      <th>Звезды</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="gameState, iterStat : ${topPlayers}">
      <td>
        <span th:if="${iterStat.index == 0}" class="gold"><i class="fas fa-medal"></i> 🥇</span>
        <span th:if="${iterStat.index == 1}" class="silver"><i class="fas fa-medal"></i> 🥈</span>
        <span th:if="${iterStat.index == 2}" class="bronze"><i class="fas fa-medal"></i> 🥉</span>
        <span th:if="${iterStat.index > 2}" th:text="${iterStat.index + 1}"></span>
      </td>
      <td th:text="${gameState.user.name}"></td>
      <td th:text="${gameState.score}"></td>
      <td>
        <span th:each="i : ${#numbers.sequence(0, gameState.score / 100)}" class="star">★</span>
      </td>
    </tr>
    </tbody>
  </table>

</div>
</body>
</html>
